name: securebank-next

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: securebank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      BANKING_MIGRATOR_PASSWORD: ${BANKING_MIGRATOR_PASSWORD:?Set BANKING_MIGRATOR_PASSWORD in .env}
      BANKING_APP_PASSWORD: ${BANKING_APP_PASSWORD:?Set BANKING_APP_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d securebank"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/docker/keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres_data:
  keycloak_data:
