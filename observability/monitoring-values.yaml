# EKS manages these control-plane components; their metrics endpoints
# are not accessible through the chart's usual discovery configuration.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    replicas: 1
    retention: 24h
    retentionSize: 3GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-encrypted
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  service:
    type: ClusterIP

  tplConfig: false
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: "null"
      group_by: ["namespace", "alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: watchdog
          matchers:
            - 'alertname="Watchdog"'
          group_by: ["alertname"]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        - receiver: "null"
          matchers:
            - 'alertname="InfoInhibitor"'
        - receiver: slack
          matchers:
            - 'severity=~"warning|critical"'

    receivers:
      - name: "null"
      - name: watchdog
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-watchdog/ping-url
            send_resolved: false
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#securebank-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] SecureBank dev — {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}
              *Severity:* {{ .Labels.severity }}
              *Namespace:* {{ .Labels.namespace }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ end }}

  alertmanagerSpec:
    replicas: 1
    secrets:
      - alertmanager-slack
      - alertmanager-watchdog
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-encrypted
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

grafana:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: gp3-encrypted
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
  initChownData:
    enabled: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
