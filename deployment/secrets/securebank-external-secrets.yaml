apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banking-app
  namespace: securebank
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: securebank-db-app
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: BANKING_APP_PASSWORD
      remoteRef:
        key: securebank-next/dev/banking-app
        property: BANKING_APP_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banking-migrator
  namespace: securebank
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: securebank-db-migrator
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: BANKING_MIGRATOR_PASSWORD
      remoteRef:
        key: securebank-next/dev/banking-migrator
        property: BANKING_MIGRATOR_PASSWORD
