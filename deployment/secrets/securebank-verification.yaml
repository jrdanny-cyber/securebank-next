apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banking-app-verification
  namespace: securebank
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: banking-app-verification
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: BANKING_APP_PASSWORD
      remoteRef:
        key: securebank-next/dev/banking-app
        property: BANKING_APP_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banking-migrator-verification
  namespace: securebank
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: banking-migrator-verification
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: BANKING_MIGRATOR_PASSWORD
      remoteRef:
        key: securebank-next/dev/banking-migrator
        property: BANKING_MIGRATOR_PASSWORD
