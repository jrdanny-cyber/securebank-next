apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: keycloak-db
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: KC_DB_PASSWORD
      remoteRef:
        key: securebank-next/dev/keycloak-db
        property: KC_DB_PASSWORD
