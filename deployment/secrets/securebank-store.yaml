apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-sync
  namespace: securebank
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::535079144516:role/securebank-next-dev-securebank-secret-sync
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: securebank
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: secret-sync
