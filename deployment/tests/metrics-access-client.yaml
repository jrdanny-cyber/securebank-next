apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-access-client
  namespace: securebank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-access-client
  template:
    metadata:
      labels:
        app: metrics-access-client
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: busybox:1.36.1
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
