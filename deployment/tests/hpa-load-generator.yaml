apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: hpa-validation
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 600
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: load-generator
      image: busybox:1.36.1
      command:
        - /bin/sh
        - -c
        - 'while true; do wget -q -T 5 -O /dev/null http://php-apache; done'
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
