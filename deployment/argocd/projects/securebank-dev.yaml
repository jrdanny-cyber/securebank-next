apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: securebank-dev
  namespace: argocd
spec:
  description: SecureBank development application
  sourceRepos:
    - https://github.com/jrdanny-cyber/securebank-next.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: securebank
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: networking.k8s.io
      kind: Ingress
    - group: monitoring.coreos.com
      kind: ServiceMonitor
