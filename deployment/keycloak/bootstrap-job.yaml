apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-bootstrap
  namespace: identity
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          command: ["psql"]
          args: ["-X", "--no-password", "--file=/bootstrap/bootstrap.sql"]
          env:
            - name: PGHOST
              value: securebank-next-dev-postgres.ca5q6w8w0izb.us-east-1.rds.amazonaws.com
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: securebank
            - name: PGUSER
              value: banking_admin
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /certs/rds-ca-bundle.pem
            - name: PGCONNECT_TIMEOUT
              value: "15"
            - name: HOME
              value: /tmp
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-bootstrap-admin
                  key: PGPASSWORD
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: KC_DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: certificates
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-db-bootstrap
        - name: certificates
          configMap:
            name: securebank-rds-ca
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
