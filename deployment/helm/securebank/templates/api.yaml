apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ printf "%s@%s" .Values.api.image.repository (required "Set api.image.digest" .Values.api.image.digest) | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9001
          env:
            - name: BANKING_DB_URL
              value: {{ required "Set api.database.url" .Values.api.database.url | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.api.database.username | quote }}
            - name: BANKING_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set api.database.existingSecret" .Values.api.database.existingSecret | quote }}
                  key: {{ .Values.api.database.passwordKey | quote }}
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: BANKING_MIGRATOR_PASSWORD
              value: ""
            - name: BANKING_JWT_ISSUER
              value: {{ required "Set api.auth.issuerUri" .Values.api.auth.issuerUri | quote }}
            - name: BANKING_JWT_JWK_SET_URI
              value: {{ required "Set api.auth.jwkSetUri" .Values.api.auth.jwkSetUri | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.api.database.caConfigMap }}
            - name: database-ca
              mountPath: /etc/securebank/database-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- if .Values.api.database.caConfigMap }}
        - name: database-ca
          configMap:
            name: {{ .Values.api.database.caConfigMap | quote }}
        {{- end }}
