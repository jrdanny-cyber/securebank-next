{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ default (printf "%s-migration" .Release.Name) .Values.migration.jobName }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: {{ printf "%s@%s" .Values.api.image.repository (required "Set api.image.digest" .Values.api.image.digest) | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - "--migrate-only"
          env:
            - name: BANKING_DB_URL
              value: {{ required "Set api.database.url" .Values.api.database.url | quote }}
            - name: BANKING_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set migration.existingSecret" .Values.migration.existingSecret | quote }}
                  key: {{ .Values.migration.passwordKey | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.api.database.caConfigMap }}
            - name: database-ca
              mountPath: /etc/securebank/database-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- if .Values.api.database.caConfigMap }}
        - name: database-ca
          configMap:
            name: {{ .Values.api.database.caConfigMap | quote }}
        {{- end }}
{{- end }}
