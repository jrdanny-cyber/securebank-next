apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api-metrics
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: management
      port: 9001
      targetPort: management
