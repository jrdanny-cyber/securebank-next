name: Secret Scanning

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb

    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pull pinned scanner image
        shell: bash
        run: docker pull "$GITLEAKS_IMAGE"

      - name: Scan the checked-out commit and its history
        shell: bash
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env GIT_CONFIG_GLOBAL=/dev/null \
            --env GIT_CONFIG_SYSTEM=/dev/null \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            "$GITLEAKS_IMAGE" \
            git /repo \
            --log-opts="HEAD" \
            --redact=100 \
            --no-banner \
            --verbose \
            --exit-code=1
